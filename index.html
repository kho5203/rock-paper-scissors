<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <script src="./rock-paper-scissors.js" defer></script>
  </head>
  <body>
    <div id="choices">
      <button id="rock">Rock</button>
      <button id="scissors">Scissors</button>
      <button id="paper">Paper</button>
    </div>
    <div id="scoreboard">
      <h2 id="result">Click a button to start a game!</h2>
      <p id="playerPoints">Human Score: 0</p>
      <p id="computerPoints">Computer Score: 0</p>
      <h2 id="winner">Who will win?</h2>
    </div>
  </body>
</html>
